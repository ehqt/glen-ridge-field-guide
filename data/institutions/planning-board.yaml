# Glen Ridge Field Guide: one institution file
# From the borough's Planning Board page, the board's 2021 bylaws and the
# council's 2026 appointments resolution, read 2026-10-11.

id: planning-board
name: Planning Board
aliases: [Glen Ridge Planning Board]
category: land-use

summary: >
  Hears applications for subdivisions, site plans and conditional uses, and
  prepares the Borough Master Plan.
powers:
  - Hear applications for major and minor subdivisions, site plan approvals and conditional uses
  - Hear bulk variances that come with a subdivision, site plan or conditional use application
  - Hear appeals of Historic Preservation Commission decisions
  - Prepare the Borough Master Plan under the New Jersey Municipal Land Use Law
  - Recommend changes to the Official Map and the zoning ordinances to the Borough Council
limits:
  - Change the zoning ordinances itself. It recommends changes to the Borough Council.

governed_by:
  statute: N.J.S.A. 40:55D-23        # cited in Resolution 3-26
  bylaws: 2021 bylaws (PDF)
appointed_by: The Mayor, with the Borough Council's approval
seated_source: { title: "Resolution 3-26, appointments and terms, Jan 5 2026 (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/01/Resolution-3-26.pdf" }
reports_to: null
member_terms: 4 years for Class IV members, 2 years for alternates, 1 year for Classes I to III

