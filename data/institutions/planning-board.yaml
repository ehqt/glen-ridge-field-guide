meets:
  schedule: Third Wednesday of each month, 7:30 pm
  schedule_note: >
    From the board's 2021 bylaws, which let the board set other dates. Check
    the borough calendar for the current year.
  location: Glen Ridge Municipal Building
  quorum: 5
roster_as_of: 2026

how_to_engage:
  public_comment: >
    All regular and special meetings are open to the public. Depending on the
    application, owners within 200 feet are sent a notice, which tells them
    of their right to be heard at the meeting.
  notice: Depending on the type of application, every property owner within 200 feet is notified.
  contact:
    phone: 973-748-8444

