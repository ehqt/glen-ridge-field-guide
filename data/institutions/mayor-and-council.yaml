# Glen Ridge Field Guide: one institution file
# Everything here is from the borough's own pages and documents, read
# 2026-10-11. Fields set to null are not stated there.

id: mayor-and-council
name: Mayor and Borough Council
aliases: [Mayor and Council, Borough Council, Council, governing body]
category: borough-government

summary: >
  The borough's elected governing body: a Mayor and a six-member Borough
  Council, under the Borough form of New Jersey municipal government.
powers:
  - Approve and adopt the borough's municipal budget
  - Confirm the Mayor's appointments to borough boards, commissions and offices
  - Set the council's meeting schedule and adopt its own bylaws each January
limits:
  - null   # TO VERIFY

how_seated: >-
  Elected by voters. The Mayor is elected directly to a four-year term. The
  six Council members are elected at large to three-year terms, with two
  seats up each year.
seated_source: { title: "Mayor & Council (borough page)", url: "https://www.glenridgenj.org/council/" }
reports_to: null

members:
  # Names, offices and term ends are from the borough's Mayor & Council page.
  - { name: Deborah Mans,     role: Mayor,             term_ends: "2027-12-31" }
  - { name: LoriJeane Moody,  role: Council President, term_ends: "2026-12-31" }
