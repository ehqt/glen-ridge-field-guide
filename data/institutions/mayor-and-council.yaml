  - { name: Rebecca Meyer,    role: Councilor,         term_ends: "2027-12-31" }
  - { name: Steve Zimet,      role: Councilor,         term_ends: "2027-12-31" }
  - { name: Rich Law,         role: Councilor,         term_ends: "2028-12-31" }
  - { name: Anthony Turiano,  role: Councilor,         term_ends: "2028-12-31" }

professionals:
