  - { name: Yenlys Flores-Bolivard, role: Municipal Clerk }
  - { name: John Malyska,           role: Borough Attorney, credentials: Esq. }

meets:
  schedule: Second and fourth Monday of each month, 7:30 pm
  schedule_note: During July and August, meetings are held on the second Monday only.
  location: Council Chamber, Glen Ridge Municipal Building
  quorum: null

how_to_engage:
  public_comment: >
    Council agendas include a "Comments of the Public" item. Comments are
    limited to five minutes per person.
  contact:
    phone: 973-748-8400
    address: 825 Bloomfield Avenue, Glen Ridge, NJ 07028

