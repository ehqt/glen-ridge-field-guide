  recorded_video: https://www.glenridge.org/page/board-of-education-meetings-video

how_to_engage:
  public_comment: >
    Regular meetings have two public comment periods. The first, near the
    start, is for items on the agenda. The second, near the end, is for any
    topic relating to the Glen Ridge schools. Sign up with your name and
    municipality on the sheet by the podium. Each speaker may speak once per
    period, for up to two minutes.
  written_comment: >
    Email or write to the Business Administrator/Board Secretary with your
    name and address. Comments must arrive by 10:00 am on the day of the
    meeting and are read aloud for up to two minutes.
  contact:
    district_phone: 973-429-8300
    district_address: 12 High Street, Glen Ridge, NJ 07028
    board_email: null   # no board-specific address found

