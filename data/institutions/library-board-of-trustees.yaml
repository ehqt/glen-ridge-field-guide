# Glen Ridge Field Guide: one institution file
# From the library's Board of Trustees page and the council's 2026
# appointments resolution, read 2026-10-11. The library page was read
# through an automated fetch, not in a browser.

id: library-board-of-trustees
name: Library Board of Trustees
aliases: [Glen Ridge Library Board, Library Board, Public Library]
category: services

summary: >
  The board of trustees of the Glen Ridge Public Library: seven members
  appointed by the Mayor, plus the Mayor and the Superintendent of Schools
  (or their alternates) as voting ex-officio members.
powers:
  # From the board's 2025 bylaws.
  - Appoint the Library Director, who runs the library under the board's direction and review
  - Elect its own President, Vice-President, Treasurer and Secretary each January
  - Approve actions by a majority vote of the members present
limits:
  - null   # TO VERIFY

governed_by:
  statute: N.J.S.A. 40:54-9          # cited in Resolution 3-26
  bylaws: 2025 bylaws (PDF)
appointed_by: The Mayor, with the Borough Council's approval
seated_source: { title: "Resolution 3-26, appointments and terms, Jan 5 2026 (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/01/Resolution-3-26.pdf" }
reports_to: null
member_terms: 5 years for trustees, 1 year for the Mayor's designee

members:
  # Names and term ends are from Resolution 3-26; offices are from the
  # library's page. The library page spells two names differently ("Matt
  # Doyle", "Damein Phoenix") and also lists the Mayor and the Superintendent
  # of Schools as ex-officio.
  - { name: Bernice Clark Bonnett, role: President,                        term_ends: "2030-12-31" }
  - { name: Marilyn Law,           role: Vice President,                   term_ends: "2028-12-31" }
  - { name: Tina Payne,            role: Secretary,                        term_ends: "2027-12-31" }
  - { name: David Lefkovits,       role: "Treasurer; Mayor's Designee",    term_ends: "2026-12-31" }
  - { name: James Doyle,           role: Trustee,                          term_ends: "2029-12-31" }
  - { name: Edward Kastenmeier,    role: Trustee,                          term_ends: "2028-12-31" }
  - { name: Rohit Tote,            role: Trustee,                          term_ends: "2030-12-31" }
  - { name: Jeanna Velechko,       role: Trustee,                          term_ends: "2026-12-31" }
  - { name: Damien Phoenix,        role: "Superintendent's Designee",      term_ends: "2030-12-31" }

professionals:
  - { name: Tina Marie Doody, role: Library Director }

meets:
  schedule: Second Wednesday of the month, 7:30 pm
  schedule_note: >
    No meetings in July or August. The 2026 schedule has exceptions: January
    14 (reorganization, 6:00 pm), June 17, and December 9 (6:00 pm). The
    schedule may change without notice.
  location: First floor meeting room, Glen Ridge Public Library, 240 Ridgewood Avenue
  quorum: 5
roster_as_of: 2026

how_to_engage:
  public_comment: >
    The public is welcome at any public session. Agendas are posted by 5:00
    pm the Friday before each meeting. Regular meetings have two public
    comment periods. The first, near the start, is for items on the agenda.
    The second, near the end, is for any library topic. Sign up with your
    name and municipality on the sheet by the meeting room door. Each
    speaker may speak once per period, for up to two minutes.
  written_comment: >
    Email or write to the Library Director with your name and address, and
    say the comments are for the Board of Trustees. Comments are due by 3:00
    pm on the Monday before the meeting. They are given to the board and
    summarized under Correspondence.
  contact:
    phone: 973-748-5482
    address: 240 Ridgewood Avenue, Glen Ridge, NJ 07028

