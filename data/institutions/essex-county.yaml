# Glen Ridge Field Guide: one institution file
# Limited to what touches a Glen Ridge resident: the County Executive, the
# Board of County Commissioners, and the county budget. From the county's
# site (essexcountynj.org), the commissioners' site (ecfnj.com) and the
# county's 2026 budget document, read 2026-10-11.

id: essex-county
name: Essex County government
aliases: [Essex County, County of Essex, Board of County Commissioners, County Commissioners, County Executive]
category: county-state

summary: >
  A separate government that taxes Glen Ridge property. It is led by a
  County Executive and a nine-member Board of County Commissioners. Glen
  Ridge is in Commissioner District 5.
powers:
  # The board's powers, from its own "Definition of the County Commissioners" page.
  - Approve the county's annual operating and capital budgets
  - Pass county ordinances and resolutions
  - Advise and consent to appointments
  - Override a veto of the County Executive
  - Adopt and amend the county's Administrative Code
  - Conduct investigations
limits:
  - null   # TO VERIFY

how_seated: >-
  Elected by voters. The nine commissioners are elected at the November
  general election: five from districts and four at large. District 5
  covers Belleville, Bloomfield, Glen Ridge, Montclair and Nutley. The
  County Executive is elected too. The executive, the four at-large seats
  and the District 5 seat are all on Glen Ridge's 2026 ballot.
seated_source: { title: "Definition of the County Commissioners (commissioners' page)", url: "https://ecfnj.com/cms/15/Definition-of-the-County-Commissioners" }
reports_to: null
member_terms: concurrent; the county's 2026 budget lists every commissioner's term as expiring December 31, 2026

