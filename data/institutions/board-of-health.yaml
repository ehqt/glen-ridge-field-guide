# Glen Ridge Field Guide: one institution file
# From the borough's Board of Health page, the council's 2026 appointments
# resolution and the borough's 2026 User Friendly Budget, read 2026-10-11.

id: board-of-health
name: Board of Health
aliases: [Glen Ridge Board of Health, Health Department]
category: borough-government

summary: >
  Promotes and protects the health of borough residents. Health services
  themselves are provided through the Bloomfield Health Department.
powers:
  - Keep residents current on emerging public health needs
  - Investigate actual and potential health concerns
  - Inform residents and town officials about health issues, including the laws and regulations that protect health
  - Link residents to public health services, through the Bloomfield Health Department
limits:
  - null   # TO VERIFY

appointed_by: The Mayor, with the Borough Council's approval
seated_source: { title: "Resolution 3-26, appointments and terms, Jan 5 2026 (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/01/Resolution-3-26.pdf" }
reports_to: null
member_terms: 2 years

