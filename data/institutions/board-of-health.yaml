# Glen Ridge Field Guide: one institution file
# From the borough's Board of Health page, the council's 2026 appointments
# resolution and the borough's 2026 User Friendly Budget, read 2026-10-11.

id: board-of-health
name: Board of Health
aliases: [Glen Ridge Board of Health, Health Department]
category: borough-government

summary: >
  Promotes and protects the health of borough residents. Health services
  themselves are provided through the Bloomfield Health Department.
powers:
  - Keep residents current on emerging public health needs
  - Investigate actual and potential health concerns
  - Inform residents and town officials about health issues, including the laws and regulations that protect health
  - Link residents to public health services, through the Bloomfield Health Department
  - Under the borough code, enact and put into operation ordinances or a code for the preservation of public health
limits:
  - null   # TO VERIFY

appointed_by: The Mayor, with the Borough Council's approval
seated_source: { title: "Resolution 3-26, appointments and terms, Jan 5 2026 (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/01/Resolution-3-26.pdf" }
reports_to: null
member_terms: 2 years

members:
  # From Resolution 3-26. The borough page still shows a "2024 Members"
  # list with one different name. No officers are named in either.
  - { name: Donna Heinzen,        role: Member, term_ends: "2026-12-31" }
  - { name: Donna Lifson,         role: Member, term_ends: "2026-12-31" }
  - { name: Deborah Priestman,    role: Member, term_ends: "2026-12-31" }
  - { name: Josh Konetzni,        role: Member, term_ends: "2027-12-31" }
  - { name: Pearl Phillips,       role: Member, term_ends: "2027-12-31" }
  - { name: Michael Sherman,      role: Member, term_ends: "2027-12-31" }
  - { name: Jacqueline S. Yustein, role: Member, term_ends: "2027-12-31" }

professionals:
  # The borough page's 2024 list says "Maya Lordo". Bloomfield's directory and
  # 2026 Board of Health schedule, and the state's local health directory
  # (which lists Glen Ridge under Bloomfield), all say Maya Harlow.
  - { name: Maya Harlow,      role: "Health Officer, Bloomfield Department of Health", credentials: "MS, MCHES, REHS, HO" }
  - { name: Michael Zichelli, role: Borough Staff Liaison }

meets:
  schedule: Mondays at 6:00 pm, about every other month, on dates the board sets each year
  schedule_note: >
    The 2026 schedule lists January 26, March 16, May 18, July 20 (if
    necessary), September 21 and November 16. The borough's Board of Health
    page still describes the third Monday and the library's conference room.
  location: Mayor's Office, second floor, Glen Ridge Municipal Building, 825 Bloomfield Avenue
  quorum: null
  dates:
    - { date: 2026-01-26 }
    - { date: 2026-03-16 }
    - { date: 2026-05-18 }
    - { date: 2026-07-20, note: If necessary }
    - { date: 2026-09-21 }
    - { date: 2026-11-16 }
roster_as_of: 2026

how_to_engage:
