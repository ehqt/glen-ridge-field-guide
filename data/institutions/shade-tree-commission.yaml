# Glen Ridge Field Guide: one institution file
# From the borough's Shade Tree Commission pages and the council's 2026
# appointments resolution, read 2026-10-11.

id: shade-tree-commission
name: Shade Tree Commission
aliases: [Glen Ridge Shade Tree Commission]
category: borough-government

summary: >
  Controls the planting and care of shade trees along the borough's streets
  and in its parks.
powers:
  - Control the regulation, planting and care of shade and ornamental trees on public streets and in parks and parkways
  - Control the use of the public ground around those trees, as far as their growth and care require
  - With the Borough Forester's advice, remove or require the removal of a tree that is dangerous to public safety
  - Treat or remove a diseased tree on private property, with the owner's consent and state confirmation of the condition
  - Issue the permit required before anyone cuts, prunes, removes or plants a public tree on a street
  - Encourage arboriculture
limits:
  # Ordinance 1543, section 12.26-6.
  - Make, alter, amend or repeal ordinances
  - Charge an abutting homeowner for planting or removing a public tree

governed_by:
  ordinance: Ordinance 1543, which established the commission in 2015
appointed_by: The Mayor, with the Borough Council's approval
seated_source: { title: "Resolution 3-26, appointments and terms, Jan 5 2026 (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/01/Resolution-3-26.pdf" }
