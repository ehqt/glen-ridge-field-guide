# Glen Ridge Field Guide: one institution file
# From the borough's Historic Preservation Commission page and the council's
# 2026 appointments resolution, read 2026-10-11.

id: historic-preservation-commission
name: Historic Preservation Commission
aliases: [HPC, Glen Ridge Historic Preservation Commission]
category: land-use

summary: >
  Reviews exterior changes to properties in the Glen Ridge Historic District,
  which covers over 90% of the borough.
powers:
  - Review applications for a Certificate of Appropriateness, which is required before exterior work in the Historic District
  - Hear regular applications (major alterations, additions, new construction, demolition) at its monthly meeting
  - Approve minor applications through an expedited review
  - Grant reasonable extensions of a certificate
limits:
  - Have the final word. The Planning Board hears appeals of its decisions.
  - Review in-kind roofing replacement, or in-kind repair of a few pieces of siding. The borough page says those need no review.

governed_by:
  statute: N.J.S.A. 40:55D-107       # cited in Resolution 3-26
  ordinance: Historic Preservation Ordinance (updated September 2025)
  established: Established by municipal ordinance in 1987
appointed_by: The Mayor, with the Borough Council's approval
seated_source: { title: "Resolution 3-26, appointments and terms, Jan 5 2026 (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/01/Resolution-3-26.pdf" }
reports_to: null
member_terms: 4 years for regular members, 2 years for alternates

