  - { name: Nicholas Colello,   role: Member (Class B),      term_ends: "2028-12-31" }
  - { name: Robert Deacon,      role: Member (Class A),      term_ends: "2026-12-31" }
  - { name: Peter Korian,       role: Member (Class A),      term_ends: "2027-12-31" }
  - { name: Jeffrey Link,       role: Member (Class C),      term_ends: "2027-12-21" }
  - { name: Greg Lane,          role: Member (Class C),      term_ends: "2026-12-31" }
  - { name: Dina DeShan,        role: Alternate 1 (Class C), term_ends: "2026-12-31" }
