professionals:
  # The borough page lists both under one heading, "Consultant & Secretary".
  - { name: Steven Smolyn,  role: Consultant and Secretary (listed jointly), credentials: AIA }
  - { name: Alexei Tajzler, role: Consultant and Secretary (listed jointly), credentials: RA }

meets:
  schedule: First Wednesday of each month, 7:30 pm
  location: Online, by Zoom
  quorum: null
roster_as_of: 2026

how_to_engage:
  public_comment: Meetings are open to the public as required by law.
  apply:
    where: >-
      Email a preliminary regular application to hpc@glenridgenj.org at least
      20 calendar days before the meeting, then file the final application in
      hard copy with the Building Department at least 9 calendar days before
    format: Preliminary application in digital format, final application in hard copy
    rules:
      - Minor applications can be emailed at any time
      - Applications are not considered without the applicant or a representative present
      - A Certificate of Appropriateness is valid for two years
  contact:
    email: hpc@glenridgenj.org

