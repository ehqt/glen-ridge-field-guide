# Glen Ridge Field Guide: one service file (a department or contracted
# service, not a board: no members or meetings). From the borough's Public
# Safety page and Municipal Directory, read in a browser 2026-10-11.

id: police
name: Police Department
aliases: [Glen Ridge Police Department, GRPD, Public Safety]
category: services
layer: department

summary: >
  The borough's police department, based at 3 Herman Street. For a police,
  fire or medical emergency, call 911.
facts:
  - The Record Bureau handles police reports, and all alarms in Glen Ridge must be registered with it
  - The borough's directory also lists a Detective Bureau, Crime Prevention and a Juvenile Aid Bureau
  - School crossing guards staff the intersections marked on the borough's Safe Routes to School map
  - The department sends community information to residents through the Nixle service
  - Glen Ridge residents can book a child car seat installation by calling 973-748-4116
  - The department says its e-mail is monitored Monday through Friday during normal business hours and is not an emergency contact
  - The Public Safety page links to the department's annual reports and policies

