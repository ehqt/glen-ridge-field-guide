# Glen Ridge Field Guide: the first-meeting guide and the glossary.
# Each entry states only what its sources say. The state statutes were read
# from copies hosted by New Jersey state agencies where one was found; the
# titles below say which copy and how old it is.

last_verified: 2026-10-11

meeting_basics:
  - title: You can walk in
    body: >-
      State law says all meetings of public bodies shall be open to the
      public at all times, apart from the closed portions described below.
    sources:
      - &opma { title: "Open Public Meetings Act, N.J.S.A. 10:4-12 (state copy, updated March 2022; PDF)", url: "https://www.njconsumeraffairs.gov/Documents/legal/Open-Public-Meeting-Act.pdf" }
  - title: You do not have to speak, but at two bodies you always can
    body: >-
      The same law requires a municipal governing body and a board of
      education to set aside part of every meeting for public comment on any
      governmental or school district issue. Each body decides how long
      that part is. Other public bodies may permit, prohibit or regulate
      public participation, so check the rules for the body you are visiting.
    sources:
      - *opma
  - title: Part of a meeting can be closed
    body: >-
      A public body may exclude the public only from the portion of a
      meeting that deals with certain subjects. The list in the law includes
      collective bargaining, pending or anticipated litigation, the
      employment or discipline of a specific employee, buying or leasing
      real property with public funds, and material whose disclosure would
      invade an individual's privacy. The Board of Education's agendas
      schedule a closed executive session at 6:00 pm, before the 7:00 pm
      public session.
    sources:
      - *opma
      - { title: "Board of Education agenda, October 6, 2026", url: "https://docs.google.com/document/d/12PGfuR2Bdc-a1D94CJ2tOZjpc0qmERrvId-g2FJizNo/edit?usp=sharing" }
  - title: Hearings on an application run in a set order
    body: >-
      At a Board of Adjustment hearing the applicant speaks first, then the
      Building Inspector, then private citizens. Applicants and witnesses
      are sworn, and remarks and questions from the floor go through the
      Chair. Applicants must notify property owners within 200 feet.
    sources:
      - &boabylaws { title: "Board of Adjustment bylaws (PDF)", url: "https://new.glenridgenj.org/wp-content/uploads/2025/05/AdustmentBrd2021ByLaws.pdf" }

glossary:
  - term: Alternate member
    meaning: >-
      A member appointed as "Alternate No. 1" or "Alternate No. 2". On a
      historic preservation commission, state law says alternates may take
      part in discussions but may vote only when a regular member is absent
      or disqualified. The Board of Adjustment, Planning Board and Historic
      Preservation Commission each have alternates.
    sources:
      - &mlul { title: "Municipal Land Use Law, historic preservation sections (NJ Historic Preservation Office excerpt, 2017; PDF)", url: "https://www.nj.gov/state/bac/planning/documents/mlul022017.pdf" }
      - &res326 { title: "Resolution 3-26, appointments and terms, Jan 5 2026 (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/01/Resolution-3-26.pdf" }
  - term: Certificate of Appropriateness
    meaning: >-
      The approval required before exterior work on a property in the Glen
      Ridge Historic District. The Historic Preservation Commission reviews
      the applications. A certificate is valid for two years.
    institution: historic-preservation-commission
    sources:
      - &hpc { title: "Historic Preservation Commission (borough page)", url: "https://www.glenridgenj.org/hpc/" }
  - term: Class A, B and C members
    meaning: >-
      The categories of seat on a historic preservation commission under
      state law. A Class A member is knowledgeable in building design and
      construction or architectural history. A Class B member is
      knowledgeable or has a demonstrated interest in local history. Either
      may live outside the municipality. The remaining regular members are
      Class C, who must be citizens of the municipality. Glen Ridge's
      ordinance sets seven members and two alternates, requires at least
      three regular members from Classes A and B, and allows no more than
      two members who live outside the borough.
    institution: historic-preservation-commission
    sources:
      - *mlul
      - { title: "Historic Preservation Ordinance (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/01/Historic-Preservation-Ordinance-1827.pdf" }
  - term: Executive session
    aliases: [Closed session]
    meaning: >-
      A part of a meeting the public may not attend. State law allows a
      public body to exclude the public only while it discusses subjects on
      a set list, such as collective bargaining, litigation or the
      employment of a specific person. "Executive session" is the name the
      Board of Education's agendas use.
    sources:
      - *opma
      - { title: "Board of Education agenda, October 6, 2026", url: "https://docs.google.com/document/d/12PGfuR2Bdc-a1D94CJ2tOZjpc0qmERrvId-g2FJizNo/edit?usp=sharing" }
  - term: Governing body
    meaning: >-
      In Glen Ridge, the Mayor and the six-member Borough Council together.
    institution: mayor-and-council
    sources:
      - { title: "Mayor & Council (borough page)", url: "https://www.glenridgenj.org/council/" }
  - term: Historic District
    meaning: >-
      The Glen Ridge Historic District, which the borough says covers over
      90% of the borough. Exterior work on a property inside it needs a
      Certificate of Appropriateness.
    institution: historic-preservation-commission
    sources:
      - *hpc
      - { title: "Historic District map (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2025/07/historicmap14.pdf" }
  - term: Master Plan
    meaning: >-
      A plan the Planning Board may prepare and, after a public hearing,
      adopt or amend, "to guide the use of lands within the municipality".
      Glen Ridge's Planning Board prepares the Borough Master Plan.
    institution: planning-board
    sources:
      - *mlul
      - { title: "Planning Board (borough page)", url: "https://www.glenridgenj.org/planning-board/" }
  - term: Ordinance
    meaning: >-
      An act or regulation of a municipality's governing body that must be
      put in writing, read at more than one meeting and published.
    sources:
      - &ordres { title: "N.J.S.A. 40:49-1 (FindLaw copy, current as of January 1, 2024)", url: "https://codes.findlaw.com/nj/title-40-municipalities-and-counties/nj-st-sect-40-49-1/" }
  - term: Public comment
    meaning: >-
      The part of a meeting set aside for members of the public to speak.
      State law requires one at every meeting of a municipal governing body
      and of a board of education, and lets each body decide how long it is.
    sources:
      - *opma
  - term: Reorganization meeting
    meaning: >-
      The January meeting at which a body organizes for the year. At the
      Borough Council's, newly elected members are sworn in and the Mayor makes the
      year's appointments. At the Board of Adjustment's in January 2025, the
      board chose its Chair and Vice Chair.
    sources:
      - { title: "Council agendas, January 5 2026 (borough page)", url: "https://www.glenridgenj.org/glen-ridge-adjourned-annual-council-meeting-agendas-01-05-2025/" }
      - { title: "Board of Adjustment reorganization minutes, Jan 9 2025 (PDF)", url: "https://www.glenridgenj.org/bminutes/BA2025-01-09.pdf" }
  - term: Resolution
    meaning: >-
      An act or regulation of a municipality's governing body that must be
      put in writing but, unlike an ordinance, may be finally passed at the
      meeting where it is introduced. The Council's yearly appointments and
      its adoption of the budget are both made by resolution.
    sources:
      - *ordres
      - *res326
      - { title: "Resolution 89-26, adoption of the 2026 municipal budget (PDF)", url: "https://www.glenridgenj.org/wp-content/uploads/2026/05/Resolution-89-26-Budget-Adoption-1-1.pdf" }
  - term: 200-foot notice
    meaning: >-
      The notice an applicant must send to property owners within 200 feet
      of the property. For Planning Board applications it depends on the
      type of application, and the notice tells owners of their right to be
      heard at the meeting.
    sources:
      - *boabylaws
      - { title: "Planning Board (borough page)", url: "https://www.glenridgenj.org/planning-board/" }
  - term: Variance
    meaning: >-
      An exception to the borough's zoning ordinances, which the Board of
      Adjustment can grant when strict enforcement would cause hardship. The
      Planning Board hears bulk variances that come with a subdivision, site
      plan or conditional use application.
    institution: board-of-adjustment
    sources:
      - { title: "Board of Adjustment (borough page)", url: "https://new.glenridgenj.org/?p=992" }
      - { title: "Planning Board (borough page)", url: "https://www.glenridgenj.org/planning-board/" }

# The permit finder. From the borough's Building Department, Easy Access
# Forms and Municipal Directory pages, read in a browser 2026-10-11, and
# from the institution files. It says who to ask, not whether a given
# project will be approved.
permits:
  - project: Build, renovate or repair, inside or out
    who: Building Department
    body: >-
      Construction permits are required for all interior and exterior
      construction work on all structures. The borough asks homeowners to
      contact the Building Department before starting. Work that needs a
      building, electrical, plumbing or fire inspection must be filed with
      the department and approved before a permit is issued.
    contact: 973-748-8400 ext. 233, building@glenridgenj.org
    sources:
      - &building { title: "Building Department (borough page)", url: "https://www.glenridgenj.org/building-department/" }
  - project: Change the outside of a property in the Historic District
    who: Historic Preservation Commission
    body: >-
      A Certificate of Appropriateness is required before exterior work in
      the Historic District, which covers over 90% of the borough. The
      borough's forms page says that in most cases construction that is
      visible from the street and in a Historic District needs the
      commission's review. In-kind roofing replacement, and in-kind repair
      of a few pieces of siding, need no review.
    contact: hpc@glenridgenj.org
    institution: historic-preservation-commission
    sources:
      - { title: "Historic Preservation Commission (borough page)", url: "https://www.glenridgenj.org/hpc/" }
      - &forms { title: "Easy Access Forms (borough page)", url: "https://www.glenridgenj.org/permits/" }
  - project: Build something the zoning ordinances do not allow
    who: Board of Adjustment
    body: >-
      The Board of Adjustment can grant a variance, an exception to the
      zoning ordinances, when strict enforcement would cause hardship. It
      hears applications at formal public hearings, and applicants must
      notify property owners within 200 feet.
    contact: planning@glenridgenj.org
    institution: board-of-adjustment
    sources:
      - { title: "Board of Adjustment (borough page)", url: "https://new.glenridgenj.org/?p=992" }
      - { title: "Board of Adjustment bylaws (PDF)", url: "https://new.glenridgenj.org/wp-content/uploads/2025/05/AdustmentBrd2021ByLaws.pdf" }
  - project: Subdivide a lot, or apply for a site plan or conditional use
    who: Planning Board
    body: >-
      The Planning Board hears applications for major and minor
      subdivisions, site plan approvals and conditional uses, along with any
      bulk variances that come with them.
    contact: 973-748-8444
    institution: planning-board
    sources:
      - { title: "Planning Board (borough page)", url: "https://www.glenridgenj.org/planning-board/" }
  - project: Remove a tree
    who: Borough Arborist and Shade Tree Commission
    body: >-
      The borough has a tree removal application on its forms page. Under
      Ordinance 1543, no one may cut, prune, remove or plant a public tree on
      a street without a permit from the Shade Tree Commission. That
      ordinance covers public trees; this guide has not found the rules for
      trees on private property, so ask the Arborist.
    contact: 973-748-8400 ext. 202, trees@glenridgenj.org
    institution: shade-tree-commission
    sources:
      - *forms
      - { title: "Shade Tree Commission (borough page)", url: "https://www.glenridgenj.org/shadetree/" }
      - { title: "Ordinance 1543, establishing the Shade Tree Commission (Word document)", url: "https://www.glenridgenj.org/wp-content/uploads/2025/07/Ordinance1543.doc" }
      - &directory { title: "Municipal Directory (borough page)", url: "https://www.glenridgenj.org/grdirectory/" }
  - project: Build or repair a sidewalk or driveway apron
    who: Department of Public Works
    body: Application for the permit is made to the Department of Public Works.
    contact: 973-748-8400 ext. 223
    sources:
      - *forms
  - project: Open or dig in the street
    who: Building Department
    body: >-
      The borough has a street opening permit request application, which
      sets out inspection and notification requirements. The Building
      Department manages work within the borough's right-of-way.
    contact: 973-748-8400
    sources:
      - *forms
      - *building
  - project: Put a portable storage unit on your property
    who: Zoning Officer
    body: >-
      A portable home storage unit may be placed on a property only once
      the Zoning Officer has issued a permit.
    sources:
      - *forms
  - project: Place a dumpster
    who: Police Department Traffic Unit
    body: The dumpster permit form is on the borough's forms page, which gives the Traffic Unit as the contact.
    contact: 973-748-5400
    sources:
      - *forms
  - project: Get a Certificate of Occupancy
    who: Building Department
    body: The Building Department reviews and issues Certificates of Occupancy.
    contact: 973-748-8400 ext. 233, building@glenridgenj.org
    sources:
      - *building

# The "I want to..." finder. From the borough's Easy Access Forms,
# Municipal Directory and Building Department pages, read in a browser
# 2026-10-11. Offices and extensions only; the people who hold them are
# left out so the list does not go stale when staff change.
tasks:
  - want: Speak at a public meeting
    who: The body that is meeting
    body: >-
      The Borough Council and the Board of Education must take public
      comment at every meeting. Other bodies set their own rules.
    to: /first-meeting
    to_label: Your first public meeting
    sources:
      - *opma
  - want: Build, renovate, or change the outside of a house
    who: Building Department, and often a board
    body: The permit finder lists who to ask for each kind of project.
    to: /permits
    to_label: Permit finder
    sources:
      - *building
  - want: Volunteer for a board or commission
    who: The Mayor and Borough Council
    body: >-
      The borough's forms page has a volunteer application. The Mayor
      appoints the members of borough boards and commissions each January,
      and the Council confirms them.
    contact: 973-748-8400
    sources:
      - *forms
      - *res326
  - want: Request a public record
    who: Borough Clerk's office
    body: >-
      The Clerk's office handles requests under the Open Public Records Act
      (OPRA). The forms page has an online request and a printable form.
    contact: 973-748-8400 ext. 220
    sources:
      - *forms
  - want: Get a birth, death or marriage certificate
    who: Vital Statistics
    body: >-
      The borough holds birth records for births in Glen Ridge at Hackensack
      Meridian Mountainside Hospital, death records where the person died in
      Glen Ridge, and marriage records for marriages in Glen Ridge. The fee
      is $25.00 for one copy and $10.00 for each additional copy.
    contact: 973-748-8400 ext. 221
    sources:
      - *forms
  - want: License a dog
    who: Clerk's office
    body: >-
      Dog licenses are issued at the beginning of each year. Renewal is
      $18.00 for altered dogs and $21.00 for unaltered dogs.
    contact: 973-748-8400 ext. 222
    sources:
      - *forms
  - want: Hold a garage or yard sale
    who: Clerk's office
    body: The forms page has an online garage and yard sale application.
    contact: 973-748-8400 ext. 222
    sources:
      - *forms
  - want: Hold a block party
    who: Borough Administrator
    body: Submit the block party application to the Borough Administrator one week before any Council meeting.
    contact: 973-748-8400
    sources:
      - *forms
  - want: Run a raffle
    who: Borough Administrator
    body: >-
      Read the applicant letter, then submit the raffle license application
      to the Borough Administrator at least 30 days before the event.
    contact: 973-748-8400 ext. 220
    sources:
      - *forms
  - want: Film in Glen Ridge
    who: Clerk's office
    body: Filming permits are handled through the Clerk's office. Read the filming welcome letter first, then complete the application.
    contact: 973-748-8400 ext. 222
    sources:
      - *forms
  - want: Reserve a field or the gazebo, or rent the Senior/Community Center
    who: Department of Parks & Recreation
    body: Field and gazebo permits, and Senior/Community Center availability and rates, are handled by the Recreation office.
    contact: 973-748-2924
    sources:
      - *forms
      - *directory
  - want: Register an alarm or a security camera
    who: Police Department
    body: >-
      All alarms in Glen Ridge must be registered with the Police
      Department's Record Bureau. The department also asks residents to
      register camera systems at their home or business.
    contact: 973-748-2995
    sources:
      - *forms
  - want: Tell the police my house will be empty
    who: Police Department
    body: The forms page has a vacant house notification form for when you are going to be away.
    contact: 973-748-5400
    sources:
      - *forms
      - *directory
  - want: Get a police report
    who: Police Department Record Bureau
    body: The directory lists a Record Bureau line for police reports. For emergencies, call 911.
    contact: 973-748-2995
    sources:
      - *directory
  - want: Report a property maintenance problem
    who: Building Department
    body: The Building Department responds to property maintenance complaints.
    contact: 973-748-8400 ext. 233, building@glenridgenj.org
    sources:
      - *building
  - want: Reach the tax collector or the assessor
    who: Finance
    body: The directory lists the Tax & Water Collector at extension 236 and the Municipal Assessor at extension 249.
    contact: 973-748-8400, collector@glenridgenj.org
    to: /budget
    to_label: Where the money goes
    sources:
      - *directory
  - want: Reach Public Works
    who: Department of Public Works
    body: The department is based at the DPW Maintenance Yard, 122 Carteret Street.
    contact: 973-748-8400 ext. 223, dpw@glenridgenj.org
    sources:
      - *directory
  - want: Ask about a street tree
    who: Borough Arborist
    body: The Shade Tree Commission controls the planting and care of shade trees along the borough's streets and in its parks.
    contact: 973-748-8400 ext. 202, trees@glenridgenj.org
    institution: shade-tree-commission
    sources:
      - *directory
      - { title: "Shade Tree Commission (borough page)", url: "https://www.glenridgenj.org/shadetree/" }
